site_name: साहित्यशास्त्रम्
docs_dir: docs

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.suggest
  palette:
    - scheme: default
      primary: deep orange
      accent: amber

extra_css:
  - stylesheets/custom.css

extra_javascript:
  - javascripts/notes-toggle.js

markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - def_list
  - footnotes
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true

# The chandas/alankara detail pages under shastra/topics/_chandas/ and
# _alankara/ are intentionally not linked from nav (only reachable by
# clicking an entry's name in shastra/topics/chandas.md / alankara.md), so
# tell MkDocs not to warn/fail on them under --strict.
validation:
  nav:
    omitted_files: ignore
