header: |
  **रजोजुषे जन्मनि सत्ववृत्तये स्थितौ प्रजानां प्रलये तमःस्पृशे ।<br>
  अजाय सर्गस्थितिनाशहेतवे त्रयीमयाय त्रिगुणात्मने नमः ॥**<br>
