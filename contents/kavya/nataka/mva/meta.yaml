header: |
  **एकैश्वर्ये स्थितोऽपि प्रणतबहुफले यः स्वयं कृत्तिवासाः<br>
  कान्तासंमिश्रदेहोऽप्यविषयमनसां यः परस्ताद्यतीनाम् ।<br>
  अष्टाभिर्यस्य कृत्स्नं जगदपि तनुभिर्बिभ्रतो नाभिमानः<br>
  सन्मार्गालोकनाय व्यपनयतु स वस्तामसीं वृत्तिमीशः ॥**<br>
