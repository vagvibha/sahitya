name: Deploy साहित्यशास्त्रम् site

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Overrides the top-level `contents: read` for this job only (job-level
    # permissions replace, not add to, the top-level block) — needed to
    # push the regenerated dict/ back to main below. The deploy job further
    # down is untouched and keeps contents: read.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # scripts/engine is the shared-engine submodule (generate_indices.py,
          # dict_extract.py, dict_render.py, generate_dict.py, mkdocs_hooks.py,
          # macros_env.py) — without this, scripts/*.py are dangling symlinks.
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install mkdocs mkdocs-material pyyaml beautifulsoup4 mkdocs-macros-plugin

      - name: Generate indices (docs/ + mkdocs.yml nav)
        run: python scripts/generate_indices.py

      - name: Generate dict/
        run: python scripts/generate_dict.py

      - name: Commit dict/ if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dict/
          if git diff --cached --quiet; then
            echo "dict/ unchanged — nothing to commit"
          else
            git commit -m "Regenerate dict/ [skip ci]"
            git push origin HEAD:main
          fi

      - name: Build site
        run: mkdocs build --strict

      # Offline copy — unzips into its own sahitya/ folder, so it can sit
      # next to other sites' offline copies without mixing files.
      - name: Zip site for offline download
        env:
          SITE_DIR: sahitya
          # "false" (default): the offline copy includes this site's own
          # assets (everything under contents/assets/, e.g. audio).
          # "true": leave them out for a much smaller zip — pages still
          # work, only those files (e.g. an <audio> player's mp3) are
          # missing. Only files that came from contents/assets/ are
          # removed; site/assets/ also holds MkDocs Material's own theme
          # files (javascripts/, stylesheets/, images/), which always stay.
          EXCLUDE_ASSETS: "false"
        run: |
          rm -rf "$SITE_DIR" && cp -r site "$SITE_DIR"
          if [ "$EXCLUDE_ASSETS" = "true" ] && [ -d contents/assets ]; then
            (cd contents/assets && find . -type f) | while read -r f; do
              rm -f "$SITE_DIR/assets/$f"
            done
            find "$SITE_DIR/assets" -type d -empty -delete
          fi
          zip -rq "$SITE_DIR-offline.zip" "$SITE_DIR"

      - name: Upload zipped site (downloadable Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: sahitya-offline
          path: sahitya-offline.zip
          retention-days: 90

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
