# commentary_sections.yaml
# =======================
# Declares how generate_indices.py treats commentary/annotation-type
# <div class="..."> blocks — anything that can be individually labeled,
# hidden by default (via the notes-toggle button), and/or reordered into
# a fixed sequence. Structural content (shloka, shloka-play, karika,
# claim, refute, dialog-block, action) is NOT configured here — it's
# handled directly by the script and always stays exactly as authored.
#
# Fields per entry:
#   class              - the div's class name to match (one class per div)
#   label               - fixed display label (rendered as "<u>label</u> – content")
#   label_from_attr     - OR: read the label from this HTML attribute on the
#                         div instead of a fixed string (e.g. tika/commentary
#                         are named after their author via data-name)
#                         Omit both `label` and `label_from_attr` for a
#                         section that should never get a "<u>...</u> – "
#                         prefix (e.g. vritti — just plain hideable text).
#   hidden_by_default   - true: every instance of this class is hidden
#                         until the notes-toggle button is clicked, with
#                         no per-instance attribute needed.
#                         false: visible by default, UNLESS a specific
#                         instance adds toggle-hide="true" itself.
#                         Either way, a specific instance can always
#                         override the class default with
#                         toggle-hide="true" or toggle-hide="false".
#   reposition          - true: every occurrence in a section is extracted
#                         from wherever it was written and reinserted
#                         (in the ORDER THIS FILE LISTS reposition:true
#                         entries) right after that section's shloka (or
#                         appended at the end of the section if there's
#                         no shloka, e.g. in shastra/).
#                         false: stays exactly where it was authored —
#                         use this for anything that's part of the
#                         natural reading flow (e.g. vritti alternating
#                         with karika) and must never be moved.
#
# IMPORTANT: keep "notes" as the LAST entry below. List order among
# reposition:true entries IS the display order, so any new repositioned
# section type just needs to be added above "notes" to land before it —
# no code changes needed.
#
# A class that isn't listed here at all can still be made hideable
# per-instance, in place, by adding toggle-hide="true" directly on that
# one div — no config entry required for one-off cases.

sections:
  - class: anvaya
    label: "अन्वयः"
    hidden_by_default: true
    reposition: true

  - class: padartha
    label: "पदार्थः"
    hidden_by_default: true
    reposition: true

  - class: vyutpatti
    label: "व्युत्पत्तिः"
    hidden_by_default: true
    reposition: true

  - class: tika
    label_from_attr: data-name
    hidden_by_default: true
    reposition: true

  - class: alankara
    label: "अलङ्कारः"
    hidden_by_default: true
    reposition: true

  - class: bhavartha
    label: "भावार्थः"
    hidden_by_default: true
    reposition: true

  - class: vyakarana
    label: "व्याकरणः"
    hidden_by_default: true
    reposition: true

  - class: kosha
    label: "कोशः"
    hidden_by_default: true
    reposition: true

  - class: vritti
    hidden_by_default: false
    reposition: false

  - class: udaharana
    hidden_by_default: false
    reposition: false

  - class: commentary
    label_from_attr: data-name
    hidden_by_default: false
    reposition: true

  - class: notes
    hidden_by_default: true
    reposition: false
