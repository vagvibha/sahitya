# gloss_types.yaml
# ================
# Declares the data-type="..." values recognized on <div class="gloss">
# blocks — anything that can be individually labeled, hidden by default
# (via the notes-toggle button), and/or reordered into a fixed sequence.
#
# ALL of these share the same div class ("gloss"): what varies between
# tika/padartha/vritti/... is purely which data-type="..." value is used
# and this file's config for it — not a different class name (was
# commentary_sections.yaml, keyed by class, before this consolidation;
# see scripts/migrate_gloss_classes.py for the one-time content
# migration). "commentary" (a named commentator's remark) and "tika"
# served the exact same purpose, so they were merged into one — just use
# data-type="tika" for both; there's no separate "commentary" data-type.
#
# Structural content is NOT configured here — it's handled directly by
# the script and always stays exactly as authored:
#   - shloka (data-type="karika"/"nataka"/"dialog"/...) — the root verse
#   - dialog-block — plain prose narration/dialogue in a kavya-play
#   - action — an inline stage-direction span (not a block, no label/
#     hide/reposition concept applies)
#   - vada (data-type="claim"/"refute") — dialectical exposition; this is
#     PRIMARY argumentative content in a शास्त्र-वाद text, not secondary
#     material about the text the way a gloss is, so it's deliberately
#     its own class rather than folded in here — always visible, never
#     repositioned, its "पक्षः"/"निरासः" labels are plain CSS (see
#     .vada::before in custom.css), not driven by this file.
#
# Fields per entry:
#   data_type           - the data-type="..." value to match
#   label               - fixed display label (rendered as "<u>label</u> – content")
#   label_from_attr     - OR: read the label from this HTML attribute on the
#                         div instead of a fixed string (e.g. tika is named
#                         after its author via data-name)
#                         Omit both `label` and `label_from_attr` for a
#                         type that should never get a "<u>...</u> – "
#                         prefix (e.g. vritti — just plain hideable text).
#   hidden_by_default   - true: every instance of this data-type is hidden
#                         until the notes-toggle button is clicked, with
#                         no per-instance attribute needed.
#                         false: visible by default, UNLESS a specific
#                         instance adds toggle-hide="true" itself.
#                         Either way, a specific instance can always
#                         override the default with toggle-hide="true"
#                         or toggle-hide="false".
#   reposition          - true: every occurrence in a section is extracted
#                         from wherever it was written and reinserted
#                         (in the ORDER THIS FILE LISTS reposition:true
#                         entries) right after that section's shloka (or
#                         appended at the end of the section if there's
#                         no shloka, e.g. in shastra/).
#                         false: stays exactly where it was authored —
#                         use this for anything that's part of the
#                         natural reading flow (e.g. vritti alternating
#                         with karika) and must never be moved.
#
# IMPORTANT: keep "notes" as the LAST entry below. List order among
# reposition:true entries IS the display order, so any new repositioned
# data-type just needs to be added above "notes" to land before it — no
# code changes needed.
#
# A <div class="gloss"> whose data-type isn't listed here at all can
# still be made hideable per-instance, in place, by adding
# toggle-hide="true" directly on that one div — no config entry required
# for one-off cases (though it won't get a label or get repositioned).

types:
  - data_type: anvaya
    label: "अन्वयः"
    hidden_by_default: false
    reposition: true

  - data_type: padartha
    label: "पदार्थः"
    hidden_by_default: false
    reposition: true

  - data_type: vyutpatti
    label: "व्युत्पत्तिः"
    hidden_by_default: false
    reposition: true

  - data_type: tika
    label_from_attr: data-name
    hidden_by_default: false
    reposition: true

  - data_type: alankara
    label: "अलङ्कारः"
    hidden_by_default: false
    reposition: true

  - data_type: bhavartha
    label: "भावार्थः"
    hidden_by_default: false
    reposition: true

  - data_type: vyakarana
    label: "व्याकरणः"
    hidden_by_default: false
    reposition: true

  - data_type: kosha
    label: "कोशः"
    hidden_by_default: false
    reposition: true

  - data_type: udaharana
    hidden_by_default: false
    reposition: false

  - data_type: vritti
    hidden_by_default: false
    reposition: false

  - data_type: notes
    hidden_by_default: false
    reposition: false
